<div class="data-page">
  <div class="data-card">
    <h2>Recursos</h2>

    <div class="data-table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre del Recurso</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let recurso of recursos">
            <td>{{ recurso.codigo }}</td>
            <td>{{ recurso.nombre }}</td>
            <td class="actions-cell">
              <button class="secondary-button" (click)="editarRecurso(recurso.codigo)">Editar</button>
              <button class="danger-button" (click)="eliminarRecurso(recurso.codigo)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="data-form">
      <div class="data-input-group">
        <input type="text" [(ngModel)]="codigoRecurso" placeholder="ID del Recurso">
        <button (click)="nuevoRecurso()">Añadir Nuevo Recurso</button>
      </div>

      <div *ngIf="mostrarFormulario" class="data-inline-form">
        <input type="text" [(ngModel)]="nombreRecurso" placeholder="Nombre del Recurso">
        <button class="primary-button" (click)="confirmarAccion()">Confirmar</button>
      </div>
    </div>
  </div>
</div>
